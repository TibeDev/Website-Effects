<!doctype html>
<html lang="en">
  <head>
    <!-- #region Font import -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
      rel="stylesheet"
    />
    <!-- #endregion -->

    <!-- #region CSS import-->

    <!-- Basic style -->
    <link rel="stylesheet" href="./src/styling/style.css" />

    <!-- Cursor -->
    <link rel="stylesheet" href="./src/Cursor/cursor.css" />

    <link rel="stylesheet" href="./src/Clock/clock.css" />

    <!-- #endregion-->
  </head>
  <body>
    <!-- #region Cursor -->
    <div class="cursor" id="cursor" data-duration="0"></div>
    <div class="cursor" id="cursorOutline" data-duration="500"></div>
    <!-- #endregion-->

    <!-- #region Scramble effect-->
    <section>
      <span
        class="scramble"
        data-words="Tibe Van den Brande, Cool guy"
        data-interval="1500"
      ></span>
    </section>
    <!-- #endregion-->

    <!-- #region Analog clock-->
    <section>
      <div id="analog-clock">
        <div id="time-indicators"></div>
        <div class="hand" id="seconds-hand"></div>
        <div class="hand" id="minutes-hand"></div>
        <div class="hand" id="hours-hand"></div>
      </div>
    </section>
    <!-- #endregion -->

    <!-- #region Javascript Import   -->

    <!-- Scramble -->
    <script src="./src/Scramble/scramble.js"></script>

    <!-- Cursor -->
    <script src="./src/Cursor/cursor.js"></script>

    <!-- Clock -->
    <script src="./src/Clock/clock.js"></script>

    <!-- #endregion -->
  </body>
</html>
